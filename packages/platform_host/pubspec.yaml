name: platform_host
description: Thin Dart bindings for host platform windowing APIs.
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.15.0-37.0.dev
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.2.0
  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_ninja: ^0.2.0
  objective_c: ^9.4.1
  jni: ^1.0.3

flutter:
  plugin:
    platforms:
      # Only registers PHPlugin (for the application context); everything else
      # is called from Dart through JNI. Apple platforms use code assets.
      android:
        package: dev.platformhost
        pluginClass: PHPlugin

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  jnigen: ^1.0.1
  test: ^1.25.6
